[project]
name = "ema-crossover-bybit"
version = "0.1.0"
description = "EMA Crossover strategy ported from Pine Script to async Python, backtested on Bybit spot data"
requires-python = ">=3.11"

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "RUF"]
ignore = ["UP038"]  # tuple form in isinstance is faster and still idiomatic

[tool.pytest.ini_options]
testpaths = ["tests"]
